# Dokploy: set Compose file to this path only (do not use compose.override.yaml).
# Traefik terminates HTTPS. Caddy in `web` listens on :80 and proxies /api/v1 → api:8000.
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    # Kept outside Dokploy's Git checkout so redeploys never overwrite the secret.
    env_file:
      - path: ${PLANETSCALE_ENV_FILE:-/etc/scanapp-staging/planetscale.env}
        required: false
        format: raw
      # Catalogue selectors and matching artifact paths live outside the checkout.
      # Missing release selection must fail deployment instead of loading an old import.
      - path: /etc/scanapp-staging/catalogue-release.env
        required: true
        format: raw
    environment:
      DATA_DIR: /data
      CARD_INDEX_PUBLISH: ${CARD_INDEX_PUBLISH:-true}
      HEALTH_VECTOR_COVERAGE: ${HEALTH_VECTOR_COVERAGE:-false}
      CARD_INDEX_PUBLISH_DIR: ${CARD_INDEX_PUBLISH_DIR:-/data/phone-index}
      CATALOGUE_BACKEND: ${CATALOGUE_BACKEND:-planetscale}
      PORTFOLIO_DATABASE_URL: ${PORTFOLIO_DATABASE_URL:-}
      TMP_DIR: /tmp/scanapp
      PREPROCESS_CONFIG: ${PREPROCESS_CONFIG:-pad}
      USE_OCR: ${USE_OCR:-true}
      PARALLEL_GRADING: ${PARALLEL_GRADING:-true}
      GRADING_AT_CARD_DEADLINE: ${GRADING_AT_CARD_DEADLINE:-true}
      GRADING_REQUIRES_CLIENT_HINT: ${GRADING_REQUIRES_CLIENT_HINT:-false}
      APP_SLAB_DETECTION: ${APP_SLAB_DETECTION:-false}
      APP_CARD_WARP: ${APP_CARD_WARP:-false}
      APP_CAPTURE_PRESET: ${APP_CAPTURE_PRESET:-max}
      APP_JPEG_QUALITY: ${APP_JPEG_QUALITY:-95}
      APP_MAX_EDGE: ${APP_MAX_EDGE:-2000}
      APP_NATIVE_CODEC: ${APP_NATIVE_CODEC:-false}
      APP_LIVE_OUTLINE: ${APP_LIVE_OUTLINE:-true}
      APP_AUTO_CAPTURE: ${APP_AUTO_CAPTURE:-true}
      APP_NATIVE_CAMERA: ${APP_NATIVE_CAMERA:-false}
      APP_NATIVE_CAMERA_ANDROID: ${APP_NATIVE_CAMERA_ANDROID:-false}
      APP_CARD_ANYWHERE: ${APP_CARD_ANYWHERE:-true}
      TRUST_CLIENT_WARP: ${TRUST_CLIENT_WARP:-false}
      OCR_COMPLETE_FRAME_FIRST: ${OCR_COMPLETE_FRAME_FIRST:-true}
      OCR_ADAPTIVE_FOOTER: ${OCR_ADAPTIVE_FOOTER:-true}
      OCR_TITLE_ONLY_SINGLE_PRINTING: ${OCR_TITLE_ONLY_SINGLE_PRINTING:-false}
      OCR_DAMAGED_FOOTER_ORDER: ${OCR_DAMAGED_FOOTER_ORDER:-false}
      OCR_PARALLEL_REGIONS: ${OCR_PARALLEL_REGIONS:-true}
      STRUCTURED_LAYOUT_RECOVERY: ${STRUCTURED_LAYOUT_RECOVERY:-false}
      OCR_CONFLICT_TITLE_RETRY: ${OCR_CONFLICT_TITLE_RETRY:-true}
      # Slab label words (PRISTINE, PSA, cert numbers...) are never the card name, and a
      # weak visual match is rescued by printed number + name (verified artwork first).
      # docs/experiments/slab-text-identity-20261021.md
      OCR_LABEL_NAME_FILTER: ${OCR_LABEL_NAME_FILTER:-true}
      # Set code glued to a fraction (30C077/128) and promo prefixes (MEP078). Off until replayed.
      OCR_SET_CODE_PREFIX: ${OCR_SET_CODE_PREFIX:-false}
      # Promo prefix one letter off (MP078 for MEP078) and bare promo numbers gated by name. Off until replayed.
      OCR_PROMO_PREFIX_NEAR: ${OCR_PROMO_PREFIX_NEAR:-false}
      # "9/10" read for 9/108 still agrees (one cut-off digit; replay first).
      OCR_CUTOFF_TOTAL: ${OCR_CUTOFF_TOTAL:-false}
      # A bare number cannot lift a much weaker picture over the leader (replay first).
      RANK_BARE_NUMBER_GUARD: ${RANK_BARE_NUMBER_GUARD:-false}
      RANK_POKEDEX_NUMBER: ${RANK_POKEDEX_NUMBER:-false}
      # Offer more same-name prints when the printing is unsure (replay first).
      PRINTING_CHOICES_WIDER: ${PRINTING_CHOICES_WIDER:-false}
      PRINTING_FAMILY_SPECIES: ${PRINTING_FAMILY_SPECIES:-false}
      TEXT_IDENTITY_CANDIDATES: ${TEXT_IDENTITY_CANDIDATES:-true}
      # Slab labels: set + number from CGC/PSA/BGS labels (18a, SV59, TG01) become verified
      # candidates. docs/experiments/slab-label-identity-20261021.md
      SLAB_LABEL_IDENTITY: ${SLAB_LABEL_IDENTITY:-true}
      # No card frame and no printed number in the strips (a screenshot's status/browser
      # bars): one whole-image read feeds the same text paths. docs/experiments/full-image-text-fallback-20261021.md
      FULL_IMAGE_TEXT_FALLBACK: ${FULL_IMAGE_TEXT_FALLBACK:-true}
      # Slab label text repairs: PSA label name+number+language, label lines never the
      # name, attack damage never the number, numerator+name for misread denominators.
      # docs/experiments/slab-text-recovery-20261021.md
      SLAB_TEXT_RECOVERY: ${SLAB_TEXT_RECOVERY:-true}
      SCAN_STREAM_RESULTS: ${SCAN_STREAM_RESULTS:-true}
      PREVIEW_LANGUAGE_ORDER: ${PREVIEW_LANGUAGE_ORDER:-true}
      USE_CLIENT_QUAD: ${USE_CLIENT_QUAD:-false}
      # Phone's own read of the card name and number (client_text): logged, and with
      # CLIENT_TEXT_OCR=footer it stands in for the server's footer read when it confirms
      # the visual answer. Staging replay 2026-10-20: -7.2% CPU, no wrong answers.
      APP_CLIENT_TEXT: ${APP_CLIENT_TEXT:-true}
      # Stage 0 (docs/stage0-on-device-plan.md): the phone sends slab label fields and photo
      # quality; the server only logs them (stage0 line), answers are unchanged.
      APP_CLIENT_LABEL: ${APP_CLIENT_LABEL:-true}
      APP_CLIENT_QUALITY: ${APP_CLIENT_QUALITY:-true}
      # Raw number reads the phone couldn't validate (PokeSingle #161), repaired against the catalogue.
      APP_CLIENT_NUMBER_CANDIDATES: ${APP_CLIENT_NUMBER_CANDIDATES:-true}
      APP_CLIENT_EMBEDDING: ${APP_CLIENT_EMBEDDING:-true}
      # Stage 1 (docs/stage1-build-plan.md). Off in code. Staging turns it on.
      # Confirmation stays required. The background check runs on every stage 1 answer.
      STAGE1_EARLY_EXIT: ${STAGE1_EARLY_EXIT:-true}
      STAGE1_BACKGROUND_CHECK: ${STAGE1_BACKGROUND_CHECK:-true}
      # The check sees the phone's text and outline too (off: the photo alone).
      STAGE1_CHECK_PHONE_INPUTS: ${STAGE1_CHECK_PHONE_INPUTS:-false}
      STAGE1_SAMPLE_RATE: ${STAGE1_SAMPLE_RATE:-1.0}
      STAGE1_REQUIRE_CONFIRMATION: ${STAGE1_REQUIRE_CONFIRMATION:-true}
      STAGE1B_TEXT_VERIFY: ${STAGE1B_TEXT_VERIFY:-true}
      # Build-151 real-scan fixes: staging only; all code defaults remain false.
      STAGE1_SET_TOTALS: ${STAGE1_SET_TOTALS:-true}
      STAGE1_NORMALIZE_DUPLICATES: ${STAGE1_NORMALIZE_DUPLICATES:-true}
      STAGE1_PRINTING_GROUPS: ${STAGE1_PRINTING_GROUPS:-true}
      STAGE1_PROMO_NUMBERS: ${STAGE1_PROMO_NUMBERS:-true}
      STAGE1_DIAGNOSTICS: ${STAGE1_DIAGNOSTICS:-true}
      # Android fast-path fixes (docs/experiments/android-fastpath-fixes-20261024.md). Staging only.
      # The server frame fix is the one with a measured gain; the other two found nothing on the
      # A55 panel because the app drops numbers the catalogue cannot hold, so they stay off here.
      STAGE1B_SERVER_FRAME: ${STAGE1B_SERVER_FRAME:-true}
      STAGE1_NUMBER_REPAIR: ${STAGE1_NUMBER_REPAIR:-true}
      STAGE1_FUZZY_NAME: ${STAGE1_FUZZY_NAME:-false}
      # Stage 1b abstains on printing twins (the 2026-10-25 Capsule scan). Staging only.
      STAGE1_TWIN_GUARD: ${STAGE1_TWIN_GUARD:-true}
      STAGE1_FAMILY_VECTOR: ${STAGE1_FAMILY_VECTOR:-true}
      STAGE1B_FRAME_FALLBACK: ${STAGE1B_FRAME_FALLBACK:-true}
      OCR_PRINTING_FROM_TEXT: ${OCR_PRINTING_FROM_TEXT:-true}
      CLIENT_TEXT_HINTS: ${CLIENT_TEXT_HINTS:-true}
      CLIENT_TEXT_OCR: ${CLIENT_TEXT_OCR:-footer}
      # Off by default. CLIENT_TEXT_AGREE: the phone's name and number may stand in for the footer read
      # with no confidence floor when they name one card in the visual top 20 (footer mode only).
      CLIENT_TEXT_TOP20: ${CLIENT_TEXT_TOP20:-false}
      CLIENT_TEXT_AGREE: ${CLIENT_TEXT_AGREE:-false}
      ENABLE_MATCHED: ${ENABLE_MATCHED:-true}
      ORT_INTRA_THREADS: ${ORT_INTRA_THREADS:-1}
      ORT_INTER_THREADS: ${ORT_INTER_THREADS:-1}
      # Image model only; OCR keeps ORT_INTRA_THREADS. 0 = same as ORT_INTRA_THREADS.
      DINO_INTRA_THREADS: ${DINO_INTRA_THREADS:-2}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-12000000}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-12582912}
      SCAN_WAIT_LIMIT: ${SCAN_WAIT_LIMIT:-6}
      STORE_CAPTURES: ${STORE_CAPTURES:-true}
      STORE_ORIGINAL_UPLOADS: ${STORE_ORIGINAL_UPLOADS:-false}
      REVIEW_TOKEN: ${REVIEW_TOKEN:-}
      CARDMARKET_HELPER_ENABLED: ${CARDMARKET_HELPER_ENABLED:-false}
      CARDMARKET_WEBVIEW_ENABLED: ${CARDMARKET_WEBVIEW_ENABLED:-true}
      SCRAPER_ENABLED: ${SCRAPER_ENABLED:-false}
      SCRAPER_URL: ${SCRAPER_URL:-http://scraper:8000}
      SCRAPER_URLS: ${SCRAPER_URLS:-}
      SCRAPER_API_KEY: ${SCRAPER_API_KEY:-}
      SCRAPER_SESSION_HOURLY: ${SCRAPER_SESSION_HOURLY:-10}
      SCRAPER_IP_HOURLY: ${SCRAPER_IP_HOURLY:-20}
      SCRAPER_DAILY_PAGES: ${SCRAPER_DAILY_PAGES:-50}
      SCRAPER_DAILY_MB: ${SCRAPER_DAILY_MB:-50}
      SCRAPER_RESERVE_KB: ${SCRAPER_RESERVE_KB:-500}
      SCRAPER_URL_COOLDOWN_S: ${SCRAPER_URL_COOLDOWN_S:-1800}
      SCRAPER_ATTEMPT_SECONDS: ${SCRAPER_ATTEMPT_SECONDS:-90}
      SCRAPER_PAGE_GAP_S: ${SCRAPER_PAGE_GAP_S:-0}
      SCRAPER_BROWSER_LIFETIME_S: ${SCRAPER_BROWSER_LIFETIME_S:-1800}
      DAILY_PRICES_ENABLED: ${DAILY_PRICES_ENABLED:-false}
      DAILY_GAP_MIN_S: ${DAILY_GAP_MIN_S:-5}
      DAILY_GAP_JITTER: ${DAILY_GAP_JITTER:-0.3}
      DAILY_TIERS: ${DAILY_TIERS:-2:6,20:2,*:1}
      DAILY_MOVE_PCT: ${DAILY_MOVE_PCT:-10}
      DAILY_DEADLINE_UTC: ${DAILY_DEADLINE_UTC:-08:00}
      CARDMARKET_LISTING_MAX_AGE_DAYS: ${CARDMARKET_LISTING_MAX_AGE_DAYS:-7}
      DAILY_GAP_MAX_S: ${DAILY_GAP_MAX_S:-60}
      DAILY_GAP_STEP_S: ${DAILY_GAP_STEP_S:-5}
      DAILY_SESSION_PAGES: ${DAILY_SESSION_PAGES:-30}
      DAILY_SESSION_ROTATE_BEFORE_S: ${DAILY_SESSION_ROTATE_BEFORE_S:-120}
      DAILY_BROWSERS: ${DAILY_BROWSERS:-1}
      DAILY_INSTALL_MAX_AGE_DAYS: ${DAILY_INSTALL_MAX_AGE_DAYS:-30}
      PHOTO_SCRAPE_ACTIVE: ${PHOTO_SCRAPE_ACTIVE:-false}
      CONFIG_TTL_S: ${CONFIG_TTL_S:-600}
      SCAN_PRICE_START_ON_PROVISIONAL: ${SCAN_PRICE_START_ON_PROVISIONAL:-true}
      SCAN_PRICE_CANDIDATE_READS: ${SCAN_PRICE_CANDIDATE_READS:-2}
      SCAN_PRICE_WARM_READER: ${SCAN_PRICE_WARM_READER:-true}
      SCAN_PRICE_SHOW_STALE: ${SCAN_PRICE_SHOW_STALE:-true}
      SCAN_PRICE_STALE_MAX_DAYS: ${SCAN_PRICE_STALE_MAX_DAYS:-30}
      SCAN_PRICE_SERVER_READ: ${SCAN_PRICE_SERVER_READ:-fallback}
      SCAN_PRICE_SERVER_READ_STATUSES: ${SCAN_PRICE_SERVER_READ_STATUSES:-matched}
      SCAN_PRICE_SERVER_READ_DELAY_MS: ${SCAN_PRICE_SERVER_READ_DELAY_MS:-3000}
      SCAN_PRICE_SERVER_READ_DAILY_PAGES: ${SCAN_PRICE_SERVER_READ_DAILY_PAGES:-0}
    volumes:
      - scanapp-data:/data
      - scanapp-tmp:/tmp/scanapp
    expose:
      - "8000"
    networks:
      default:
        aliases:
          - scanapp-api
    # Model/OCR buffers exceeded 1.5 GiB and swapped despite free host RAM.
    # With ~42k indexed cards, scans peak at ~2.1 GiB; 2 GiB was OOM-killed.
    # 3 GiB RAM + 1 GiB swap on the existing 4 GiB host.
    mem_limit: 3072m
    memswap_limit: 4096m
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  scraper:
    build:
      context: .
      dockerfile: docker/scraper.Dockerfile
    restart: unless-stopped
    init: true
    shm_size: 1gb
    mem_limit: 1536m
    # Keeps the headless browser from taking the cores the scan worker needs.
    cpus: ${SCRAPER_CPUS:-0.5}
    environment:
      SCRAPER_API_KEY: ${SCRAPER_API_KEY:-}
      SCRAPER_LANE: ${SCRAPER_LANE:-a}
      # false = direct connection. Unset uses the proxy only when PROXY_HOST/USER/PASS are set.
      PROXY_ENABLED: ${PROXY_ENABLED:-}
      PROXY_HOST: ${PROXY_HOST:-}
      PROXY_USER: ${PROXY_USER:-}
      PROXY_PASS: ${PROXY_PASS:-}
      PROXY_USER_TEMPLATE: ${PROXY_USER_TEMPLATE:-}
      PROXY_COUNTRY: ${PROXY_COUNTRY:-}
      TZ: ${PROXY_TZ:-Europe/Berlin}
      SCRAPER_ATTEMPT_SECONDS: ${SCRAPER_ATTEMPT_SECONDS:-90}
      SCRAPER_PAGE_GAP_S: ${SCRAPER_PAGE_GAP_S:-0}
      SCRAPER_DIRECT_PROBE: ${SCRAPER_DIRECT_PROBE:-false}
      SCRAPER_NET_LOG: ${SCRAPER_NET_LOG:-true}
      SCRAPER_BROWSER_LIFETIME_S: ${SCRAPER_BROWSER_LIFETIME_S:-1800}
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      SITE_ADDRESS: ":80"
      # The short name "api" also exists on dokploy-network for another app.
      API_UPSTREAM: scanapp-api
    expose:
      - "80"
    networks:
      - default
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.scanapp.rule=Host(`scan.pokesingle.com`)
      - traefik.http.routers.scanapp.entrypoints=web
      - traefik.http.routers.scanapp.service=scanapp
      - traefik.http.services.scanapp.loadbalancer.server.port=80
      - traefik.http.services.scanapp.loadbalancer.responseforwarding.flushinterval=1ms
      - traefik.http.routers.scanapp-secure.rule=Host(`scan.pokesingle.com`)
      - traefik.http.routers.scanapp-secure.entrypoints=websecure
      - traefik.http.routers.scanapp-secure.tls=true
      - traefik.http.routers.scanapp-secure.service=scanapp

volumes:
  scanapp-data:
  scanapp-tmp:

networks:
  dokploy-network:
    external: true
